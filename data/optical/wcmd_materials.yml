- material: G4_PLASTIC_SC_VINYLTOLUENE
  provenance:
    source: Geant4 examples (TestEm3, Hadr05, amsEcal, wls) use this for plastic scintillator
    note: >
      Geant4's built-in table covers G4_POLYSTYRENE at 0.07943 mm/MeV but NOT this
      material, which arrives with 0 -- and a zero constant makes the quenched
      deposit identical to the raw one. Sub-percent for minimum-ionising muons;
      it is alphas, protons and nuclear recoils this number matters to.
  birks_constant: 0.126 mm/MeV

